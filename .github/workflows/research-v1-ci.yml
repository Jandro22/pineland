name: Pineland CI

on:
  push:
    branches: [main, research-v1]
  pull_request:
    branches: [main, research-v1]
  workflow_dispatch:

concurrency:
  group: research-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Public-release metadata audit
        run: python scripts/public_release_audit.py

  core-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[research,dev]"
      - name: Research-v1 focused tests
        run: >-
          python -m pytest
          tests/test_recovery.py
          tests/test_research_v1_runner.py
          tests/test_state_estimation.py
          tests/test_empirical.py
          -q
      - name: Emit paper contract
        run: python pineland.py paper-spec --output outputs/ci-paper-spec.json

  portable-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Keep the broad historical/research dependency surface on the
          # conservative supported interpreter. Core Research-v1 tests above
          # still exercise Python 3.14 explicitly.
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[research,dev]"
      - name: Portable regression suite
        # Historical processed panels, sealed holdouts, and generated result
        # bundles are intentionally gitignored and remain local research
        # artifacts. Their tests are part of the local certification suite,
        # not a clean-clone CI contract.
        run: >-
          python -m pytest -q
          --ignore=tests/test_afghanistan_acled_mapping.py
          --ignore=tests/test_afghanistan_case.py
          --ignore=tests/test_afghanistan_filtered_state_estimation.py
          --ignore=tests/test_afghanistan_historical_inputs.py
          --ignore=tests/test_case_readiness.py
          --ignore=tests/test_historical_database_v2.py
          --ignore=tests/test_mechanism_evidence.py
          --ignore=tests/test_predictive_competition_gate.py
          --ignore=tests/test_research_program.py
