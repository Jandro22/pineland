[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pineland-coinsim"
version = "0.13.0"
description = "A multiscale, partially observed agent-based simulation of insurgency and counterinsurgency"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Pineland COIN-SIM contributors"}]
dependencies = []

[project.optional-dependencies]
research = [
    "jsonschema>=4.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyreadr>=0.5",
    "reportlab>=4.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "shapely>=2.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pineland-sim = "pineland_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Keep pytest's temporary tree inside the checkout. This avoids Windows
# reparse-point/ACL failures in the shared system pytest temp root.
addopts = "--basetemp=.pytest-tmp"
tmp_path_retention_count = "0"
